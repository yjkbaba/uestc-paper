[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uestc-paper"
version = "0.1.0rc1"
description = "Single-paper retrieval for authorized UESTC users, open access first"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["playwright>=1.62,<2", "pypdf>=5,<7", "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
uestc-paper = "uestc_paper.cli:main"

[tool.setuptools.packages.find]
include = ["uestc_paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.data-files]
"share/uestc-paper/skills/uestc-paper" = ["skills/uestc-paper/SKILL.md"]
"share/uestc-paper/skills/uestc-paper/agents" = ["skills/uestc-paper/agents/openai.yaml"]
"share/uestc-paper/skills/uestc-paper/references" = ["skills/uestc-paper/references/uestc-access.md", "skills/uestc-paper/references/compliance.md"]
